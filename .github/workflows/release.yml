# Pushing a version tag (vX.Y.Z or vX.Y.Z-rc.N) runs the full CI and, only if
# every check passes, creates a DRAFT GitHub release with the CI-built zip
# and SHA256SUMS.txt. Nothing is published automatically: a person reviews
# the draft and publishes it, and a stable release is published only after
# the manual hardware and lab-machine acceptance checklist has passed
# (docs/COMPATIBILITY.md). Release candidates are drafted as pre-releases.
#
# Pull requests that change this file run it as a dry run (no draft).
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml"]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  draft:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # The artifact the release ships; windows-2022 also builds as a check.
      RELEASE_ARTIFACT: CritOverlay-win64-windows-2025
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.RELEASE_ARTIFACT }}
          path: release
      - name: Check tag, version, changelog and checksum
        id: check
        run: |
          set -euo pipefail
          zip=$(cd release && ls CritOverlay-v*-win64.zip)
          version=${zip#CritOverlay-v}; version=${version%-win64.zip}
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag=$GITHUB_REF_NAME
            [ "$tag" = "v$version" ] || { echo "::error::Tag $tag doesn't match APP_VERSION $version"; exit 1; }
          else
            tag=v$version
          fi
          echo "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$' \
            || { echo "::error::$tag isn't vX.Y.Z or vX.Y.Z-rc.N"; exit 1; }
          # build.py writes SHA256SUMS.txt on Windows, so lines end in CRLF.
          (cd release && tr -d '\r' < SHA256SUMS.txt | grep " $zip\$" | sha256sum -c -)
          # The changelog section for this version becomes the draft notes.
          awk -v h="## $tag" 'index($0, h) == 1 && (length($0) == length(h) || substr($0, length(h) + 1, 1) == " ") {f=1; next}
                              f && /^## / {exit} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::CHANGELOG.md has no '## $tag' section"; exit 1; }
          {
            echo
            echo "**SHA-256**"
            echo '```'
            cat release/SHA256SUMS.txt
            echo '```'
          } >> notes.md
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          case "$tag" in *-rc.*) echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=" >> "$GITHUB_OUTPUT" ;; esac
          cat notes.md
      - name: Create draft release
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          tag=${{ steps.check.outputs.tag }}
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::A release for $tag already exists; not replacing it"; exit 1
          fi
          gh release create "$tag" --draft ${{ steps.check.outputs.prerelease }} --verify-tag \
            --title "$tag" --notes-file notes.md \
            release/CritOverlay-*-win64.zip release/SHA256SUMS.txt
          echo "Draft release $tag created. Review the notes, then publish it by hand." >> "$GITHUB_STEP_SUMMARY"
